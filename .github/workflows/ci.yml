name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package itself so the console script and the optional
      # tqdm progress path are both exercised, not just the module.
      - name: Install package and test dependencies
        run: pip install -e ".[dev,progress]"
      - name: Run tests
        run: python -m pytest test_bitbrew.py -v
      - name: Smoke-test the installed console script
        run: |
          bitbrew -p "a*" --charset xy
          test "$(bitbrew -p '**' --charset ab --count)" = "4"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting of import order
        run: ruff check --select I .
